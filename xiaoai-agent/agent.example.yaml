runtime:
  # 运行模式：exclusive（独占接管原生小爱）| dual（保留原生小爱，通过外部 KWS 服务共存）
  mode: exclusive
  speech_socket: /tmp/mico_aivs_lab/usock/speech.usock
  session_idle_timeout_s: 20

# 仅 runtime.mode: dual 时生效；修改 kws 或 capture 后需重启生效
# dual:
#   kws:
#     endpoint: "192.168.31.1:5005" # 外部 UDP XPCM KWS 服务地址（见 docs/external-kws-protocol.md）
#     ping_interval_s: 30
#   capture:
#     device: "noop"       # LX06 默认：48kHz 8ch S32_LE；通用 16kHz 单麦设 sample_rate: 16000, channels: 1, format: S16_LE, ref_channel: null
#     sample_rate: 48000
#     channels: 8
#     format: S32_LE
#     mic_channel: 0
#     ref_channel: 6       # 硬件 DAC 回采通道（null 表示禁用）
#     shift_bits: 9
#   enter_prompt: "我在，请讲"
#   exit_prompt: "已退出对话模式，再见"
#   # 可选提示音文件（相对 agent.yaml 目录或绝对路径；不存在时自动回退 TTS）
#   enter_earcon: "enter_prompt.wav"
#   exit_earcon: "exit_prompt.wav"
#   thinking_earcon: "thinking_prompt.wav"
#   session_timeout_s: 60

device:
  # 单条设备命令（tts_play.sh / miplayer / ubus）的最长执行时间，秒
  command_timeout_s: 30.0
  tts_command: "/usr/sbin/tts_play.sh --notify-pns {text}"
  play_url_command: "killall miplayer 2>/dev/null; miplayer -f {url} >/tmp/xiaoai-miplayer.log 2>&1 &"
  stop_audio_command: "killall tts_play.sh miplayer 2>/dev/null; mphelper pause"
  pause_audio_command: "mphelper pause 2>/dev/null || true; for p in $(pidof miplayer 2>/dev/null); do kill -STOP \"$p\" 2>/dev/null || true; done"
  resume_audio_command: "for p in $(pidof miplayer 2>/dev/null); do kill -CONT \"$p\" 2>/dev/null || true; done; mphelper play 2>/dev/null || true"
  duck_audio_command: "amixer sget mysoftvol | awk -F'[][]' '/%/ {print $2; exit}' | tr -d '%' >/tmp/xiaoai-mysoftvol.before; amixer sset mysoftvol 25% >/dev/null 2>&1 || true"
  unduck_audio_command: "v=$(cat /tmp/xiaoai-mysoftvol.before 2>/dev/null); if [ -n \"$v\" ]; then amixer sset mysoftvol \"${v}%\" >/dev/null 2>&1 || true; fi; rm -f /tmp/xiaoai-mysoftvol.before"
  abort_command: "killall tts_play.sh miplayer 2>/dev/null; mphelper pause 2>/dev/null || true; ubus call mediaplayer media_control '{\"player\":\"mediaplayer\",\"action\":\"pause\",\"volume\":0}' 2>/dev/null || true; ubus call mediaplayer player_play_operation '{\"media\":\"app_ios\",\"action\":\"stop\"}' 2>/dev/null || true"
  # 音量控制命令（/volume 与语音「大声点」使用；以下为 LX06/OH2P 默认值，{level} 为 0-100）：
  # volume_up_command: "mphelper volume_up >/dev/null 2>&1 || true"
  # volume_down_command: "mphelper volume_down >/dev/null 2>&1 || true"
  # volume_set_command: "mphelper volume_set {level} >/dev/null 2>&1 || true"
  # volume_mute_command: "mphelper volume_set 0 >/dev/null 2>&1 || true"
  led_enabled: true
  led_listening: 3
  led_user_speaking: 4
  led_thinking: 2
  led_speaking: 5

capture:
  # mipns provides 16 kHz mono signed 16-bit little-endian PCM.
  sample_rate: 16000
  threshold: 0.006
  mic_gain: 1.0
  block_ms: 100
  pre_roll_ms: 300
  silence_ms: 1500
  min_speech_ms: 300
  max_utterance_s: 15.0
  cooldown_s: 0.7
  # 自适应 VAD / 动态静音（均为默认值，可省略）：
  # adaptive_noise_floor: true        # 按环境底噪自动抬高阈值
  # noise_floor_multiplier: 2.5       # 阈值 = 底噪 × 倍数（不低于 threshold）
  # dynamic_silence: true             # 短句更快收尾，长句容忍更长停顿
  # short_utterance_silence_ms: 600
  # long_utterance_silence_ms: 1050

asr:
  # open_ai or openai_realtime
  provider: open_ai

  # OpenAI-compatible ASR settings. Used when provider is open_ai.
  # 注意：base_url 已带路径（如 /v1 或 /api/v3）时原样使用，不再自动补 /v1。
  open_ai:
    base_url: https://api.openai.com/v1
    api_key: EMPTY
    model: whisper-1
    language: zh
    prompt: ""
    timeout_s: 10   # 默认 10（原 5 易在弱网下误超时）
    retries: 1
    # 蚂蚁百灵（实测 2026-10-25）：接口与 OpenAI audio/transcriptions 兼容。
    #   base_url: https://api.ant-ling.com/v1
    #   model: Ming-3.0-asr-tiny
    #   language: zh            # 留空 = 混语种识别
    # 限制：单文件 ≤10 MB、音频 ≤30 秒，只接受 wav/mp3；返回格式只支持 json。
    # 注意 asr 段是「需要重启」的段（AsrClient 启动时定型），改完要重启 agent。

  # OpenAI Realtime transcription WebSocket settings. Used when provider is openai_realtime.
  openai_realtime:
    base_url: https://api.openai.com/v1
    api_key: EMPTY
    model: gpt-realtime-whisper
    # FunASR's realtime Paraformer and FSMN-VAD both require 16 kHz mono PCM.
    target_sample_rate: 16000
    chunk_ms: 200
    timeout_s: 10
    retries: 1
    # Let the ASR service decide speech boundaries and emit speech_started /
    # speech_stopped. Disable only for an OpenAI-compatible service without VAD.
    server_vad:
      enabled: true
      prefix_padding_ms: 300
      silence_duration_ms: 1200
      threshold: 0.5

llm:
  # anthropic or open_ai_chat
  protocol: anthropic
  # 注意：base_url 已带路径（如 /v1、/api/v3）时原样使用，不再自动补 /v1。
  base_url: https://api.openai.com/v1
  api_key: EMPTY
  model: gpt-5.4-mini
  timeout_s: 20   # 默认 20；低于 10 会在启动时给出警告
  max_tokens: 300
  temperature: 0.5
  thinking:
    # auto, disabled, or enabled. Anthropic enabled mode also uses budget_tokens.
    mode: disabled
    budget_tokens: 1024

agent:
  # 后端 OpenAI 兼容代理若不支持 tools API（会丢弃 tool_calls 内容），设 false
  tools_enabled: true
  # 关闭工具时把当前时间注入用户消息；tools_enabled=false 时自动生效
  inject_current_time: false
  timezone: Asia/Shanghai
  weather:
    qweather_url: ""
    default_location: ""
    ip_lookup_url: https://ipapi.co/json/
    timeout_s: 5
  web_search:
    enabled: false
    tavily_url: https://api.tavily.com/search
    api_key: ""
    timeout_s: 10
    max_results: 3
    search_depth: basic

mcp:
  servers:
  - name: home_assistant
    enabled: false
    url: http://homeassistant.local:8123/api/mcp
    token: ""
    timeout_s: 10
    # Empty means expose every tool from this server.
    tools: []

tts:
  # native（默认）= 设备自带 tts_play.sh；doubao / openai 尚未接入
  provider: native
  # 外部 provider 失败或尚未接入时回退系统 TTS。
  # 关掉等于「宁可不说话也不用系统音色」，此时未接入的 provider 会直接报错。
  fallback_to_native: true
  # 播放本地音频文件的命令模板（{path} 为占位符）。留空用内置默认值：
  # killall miplayer 2>/dev/null; miplayer -f {path} >/tmp/xiaoai-tts-player.log 2>&1 &
  # playback_command: null
  # 外部 TTS 播放期间抑制采集（默认开）。miplayer 放的音频不在 pns 的回声消除
  # 参考里：不抑制时 mic 会把答案本身当成用户说话（真机日志 end=max_duration，
  # 随后 ASR 把答案转写回来，设备开始自问自答）。代价只有一个——播放中「不喊
  # 唤醒词直接插话」失效；喊唤醒词打断不受影响（那是固件层判定的）。
  suppress_capture_while_playing: true
  # 播放结束后的余量：房间混响 + 播放器缓冲尾音
  playback_tail_ms: 500
  # 播放器启动/缓冲宽限：OH2P 1.62.2 实测 miplayer 从命令返回到出声约 3.2s
  playback_startup_grace_ms: 3000
  # OpenAI 兼容的 /v1/audio/speech 后端：base_url 指向谁就是谁（官方/中转/局域网自建 shim）
  # 实测可用的后端：蚂蚁百灵（2026-10-25，OH2P 真机链路待验）
  #   base_url: https://api.ant-ling.com/v1
  #   model: Ming-3.0-tts
  #   voice: alloy          # 或改用 instructions（见下），两者至少给一个
  #   response_format: wav
  #   sample_rate: 16000    # 与语音前端一致，省一半流量
  # 实测三个特性（详见 docs/ant-ling-tts-asr.md）：
  #   ① voice/references/instructions 三者都不给 → 400；
  #   ② voice 传了不存在的音色 → HTTP 200 但 body 为空（代码按空音频判失败并回退）；
  #   ③ 换 voice 名或换 instructions 描述，输出几乎没差别——目前只有一套默认音色，
  #      voice/instructions 的现实作用是满足接口要求，不是调音色。
  openai:
    base_url: https://api.openai.com/v1
    api_key: ""
    model: gpt-4o-mini-tts
    voice: alloy
    # wav 是这台机器 miplayer 已实测能放的格式；mp3 体积小一半，等真机验过再换
    response_format: wav
    # speed: 1.0
    # sample_rate: 16000
    # instructions: "用温柔的女声，语速稍慢"
    timeout_s: 30
    # output_dir: /tmp

# 本地控制面（issue #9）。默认关闭：关闭时连端口都不 bind。
# 安全边界：这是新增的网络暴露面。给 Home Assistant 用时才打开，并且：
#   - 只绑内网地址（不要 0.0.0.0）
#   - 一定设 token（空 token = 不鉴权，内网任何主机都能让它说话）
server:
  enabled: false
  host: 127.0.0.1
  port: 8765
  token: ""
  # 端点（当前）：GET /health（socket 归属 + 收包年龄）、GET /status（同上 + pid/配置路径）
  # 鉴权：Authorization: Bearer <token>

music:
  enabled: false
  provider: navidrome
  interruption:
    # pause, duck, or none. duck uses device.duck_audio_command / unduck_audio_command.
    mode: pause
  netease:
    # External Netease API service URL. The speaker does not start this service locally.
    api_base_url: http://127.0.0.1:3300
    login_mode: captcha
    account: ""
    phone: ""
    password: ""
    md5_password: ""
    # Optional read-only seed cookie. Login refreshes are kept in memory and are not written back.
    cookie_file: null
    default_level: standard
    timeout_s: 5
    login_on_start: true
  navidrome:
    base_url: http://127.0.0.1:4533
    username: ""
    password: ""
    api_version: 1.16.1
    timeout_s: 5

airplay:
  enabled: false
  name: XiaoAI AirPlay
  port: 5000
  password: ""
  # Optional stable 6-byte identity, for example c2:46:38:ad:3e:25.
  hwaddr: ""
  output:
    backend: aplay
    aplay_path: /usr/bin/aplay
    device: default
    format: S16_LE
  interruption:
    # none or duck. duck lowers only AirPlay PCM gain while the voice agent is active.
    mode: duck
    duck_gain: 0.25
